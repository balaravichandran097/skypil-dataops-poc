services:
  - type: web
    name: skypil-dataops-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: SKYPIL_DEMO_PASSWORD
        sync: false
